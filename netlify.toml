[build]
  publish = "public"
  functions = "netlify/functions"

# the measuring tool is big (13 MB) — let phones keep it so it only downloads once
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# the measuring tool (OpenCV) is big — ship it as-is with the grade-batch function instead of bundling it
[functions]
  external_node_modules = ["@techstark/opencv-js"]
